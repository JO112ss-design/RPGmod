name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Run balance simulation
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew runBalanceSim 2>&1 | tee sim.log || true

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpgmod-jar
          path: build/libs/*.jar

      # Publishes the build log (and the jar) to the ci-log branch so it can be read with plain git.
      - name: Publish build log
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          cp sim.log /tmp/out/ 2>/dev/null || true
          echo "${{ steps.build.outcome }}" > /tmp/out/status.txt
          echo "${{ github.sha }}" > /tmp/out/sha.txt
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          if [ -f .ci/dump-sources ]; then
            ./gradlew createMinecraftArtifacts > /dev/null 2>&1 || true
            find build/moddev -name '*sources*.jar' -exec cp {} /tmp/out/ \; || true
            find ~/.gradle -path '*neoforge*' -name '*sources*.jar' -size +1M -exec cp {} /tmp/out/ \; 2>/dev/null || true
            ls -la /tmp/out
          fi
          cd /tmp/out
          for f in *.jar; do
            [ -f "$f" ] || continue
            if [ $(stat -c%s "$f") -gt 90000000 ]; then split -b 80m "$f" "$f.part-"; rm "$f"; fi
          done
          git init -q -b ci-log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ci log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
