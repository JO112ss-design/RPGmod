name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Publish build
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -rf /tmp/b && mkdir -p /tmp/b
          cp build.log /tmp/b/ 2>/dev/null || echo "no log" > /tmp/b/build.log
          echo "${{ steps.build.outcome }}" > /tmp/b/status.txt
          echo "${{ github.sha }}" > /tmp/b/sha.txt
          cp build/libs/*.jar /tmp/b/ 2>/dev/null || true
          cd /tmp/b && git init -q -b ci-log && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log

      - name: Server smoke test
        id: server
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nlevel-name=world\n' > run/server.properties
          ./gradlew runServer --console=plain > server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then break; fi
            if grep -qE 'BUILD FAILED|Crash report|Exception in server tick' server.log; then break; fi
            sleep 5
          done
          sleep 5
          jps -l | grep -viE 'gradle|jps' | awk '{print $1}' | xargs -r kill -TERM || true
          for i in $(seq 1 60); do
            if ! jps -l | grep -viE 'gradle|jps' | grep -q .; then break; fi
            sleep 2
          done
          grep -q 'Done (' server.log

      # The Resurrection mod (downed players) is played together with this one: test them side by side.
      - name: Build Resurrection for the client test
        if: steps.server.outcome == 'success'
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/JO112ss-design/Resurrection.git ../resurrection
          (cd ../resurrection && chmod +x gradlew && ./gradlew build --console=plain -q)
          mkdir -p run/mods
          find ../resurrection/build/libs -name '*.jar' ! -name '*sources*' -exec cp {} run/mods/ \;
          ls -la run/mods

      - name: Client end-to-end test
        if: steps.server.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils mesa-vulkan-drivers > /dev/null
          mkdir -p run/saves
          rm -rf run/saves/autotest && cp -r run/world run/saves/autotest
          printf 'onboardAccessibility:false\nmenuBackgroundBlurriness:0\nrenderDistance:2\nsimulationDistance:5\ngraphicsPreset:"fast"\ngraphicsMode:0\nmaxFps:20\nrenderClouds:"false"\nparticles:2\nentityShadows:false\nskipMultiplayerWarning:true\ntutorialStep:none\njoinedFirstServer:true\nguiScale:2\nlang:ja_jp\nnarrator:0\nsoundDevice:""\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          export SDL_VIDEO_FORCE_EGL=1
          export SDL_VIDEO_X11_FORCE_EGL=1
          export SDL_AUDIODRIVER=dummy
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" glxinfo -B > glxinfo.txt 2>&1 || true
          ( sleep 150; for pid in $(jps -l | grep -viE 'gradle|jps' | awk '{print $1}'); do jstack $pid >> jstack.txt 2>&1; done ) &
          timeout 1000 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClient -Pautotest --console=plain > client.log 2>&1 || true
          ls -la run/screenshots || true

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpgmod-jar
          path: build/libs/*.jar

      # Publishes game test logs and screenshots to the ci-test branch so they can be read with plain git.
      - name: Publish test results
        if: always() && github.event_name != 'pull_request' && steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          echo "${{ steps.build.outcome }}" > /tmp/out/status.txt
          echo "${{ github.sha }}" > /tmp/out/sha.txt
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          cp server.log client.log glxinfo.txt jstack.txt /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/screenshots && cp run/screenshots/*.png /tmp/out/screenshots/ 2>/dev/null || true
          (grep -h 'AUTOTEST\|ERROR\|Exception\|rpgmod' server.log client.log 2>/dev/null | head -1000) > /tmp/out/summary.log || true
          if [ -f .ci/dump-sources ]; then
            ./gradlew createMinecraftArtifacts > /dev/null 2>&1 || true
            find build/moddev -name '*.jar' -exec ls -la {} \; > /tmp/out/artifacts.txt 2>&1 || true
            MCJAR=$(find build/moddev -name '*.jar' -not -name '*sources*' -size +10M -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2)
            echo "decompiling $MCJAR" >> /tmp/out/artifacts.txt
            if [ -n "$MCJAR" ]; then
              curl -sSL -o /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
              mkdir -p /tmp/dec
              java -Xmx4G -jar /tmp/vf.jar -din=1 -rbr=1 -dgs=1 -asc=1 -rsy=1 -log=WARN "$MCJAR" /tmp/dec > /tmp/out/decompile.log 2>&1 || true
              (cd /tmp/dec && find . -name '*.jar' -exec unzip -qo {} \; ; rm -f *.jar; zip -qr /tmp/out/mc-sources.zip net com 2>/dev/null) || true
            fi
            ls -la /tmp/out
          fi
          cd /tmp/out
          for f in *.jar; do
            [ -f "$f" ] || continue
            if [ $(stat -c%s "$f") -gt 90000000 ]; then split -b 80m "$f" "$f.part-"; rm "$f"; fi
          done
          git init -q -b ci-test
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ci log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-test

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
